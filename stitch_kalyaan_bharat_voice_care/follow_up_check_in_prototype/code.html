<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
            display: inline-block;
            vertical-align: middle;
        }
        .pulse-animation {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .float-animation {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .entrance-fade-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
        .bg-overlay-gradient {
            background: linear-gradient(to bottom, rgba(242, 251, 254, 0.7), rgba(242, 251, 254, 1));
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="w-full top-0 sticky z-50 bg-background dark:bg-inverse-surface border-b border-outline-variant dark:border-outline flex items-center justify-between px-margin-mobile h-touch-target-min">
<div class="flex items-center gap-2">
<button class="flex items-center gap-2" onclick="handleNavigation()">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" data-icon="arrow_back">arrow_back</span>
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" data-icon="health_and_safety">health_and_safety</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">Kalyaan Bharat</h1>
</button>
</div>
<button class="text-on-surface-variant dark:text-surface-variant hover:bg-surface-variant/50 px-4 py-1 rounded-full transition-transform active:scale-95 font-label-lg text-label-lg">
            हिन्दी
        </button>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col relative px-margin-mobile pb-32 pt-8 max-w-2xl mx-auto w-full">
<!-- Background Artistic Image (Caring Hand) -->
<div class="absolute inset-0 -z-10 opacity-30">
<img alt="Supportive Care" class="w-full h-full object-cover grayscale" data-alt="A warm, detailed close-up shot of a younger hand gently holding an elderly hand, representing care and medical support. The lighting is soft and natural, with a clean and bright high-key atmosphere that matches a professional healthcare setting. The composition is intimate and emotional, utilizing a soft color palette of teal and white to align with a digital health interface. The mood is stable, paternal, and profoundly reassuring." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAX5ltapQgLLLsA5l5Ecgf1bLH5pFtjQKoEFKACuqnU_DwN8CBa3VykoE2ZnRQUTsa_LzbhciTw3HGj-tqQ8j_FOTCI5078f8gBMlj2yr-4n6uQY047DmFUOSEbLcKp8UJK6qfF3Ec6sJgM0jxE5WdS9WQhnxP2qQx3JijQAhgneW4qkpd-vtenryhZVtoiYVPF7C5RqdsHOzVBP45_jVTSmJVnLY5ZWPkQlY2A5TAVZ3dC6jUwfFUWc9GkdNR7RRjCzaGAl8J41OIb">
<div class="absolute inset-0 bg-overlay-gradient"></div>
</div>
<!-- Header Section -->
<div class="text-center mb-10">
<div class="float-animation inline-flex items-center justify-center p-6 bg-primary-container text-on-primary-container rounded-full mb-6">
<span class="material-symbols-outlined !text-6xl" data-icon="sentiment_very_satisfied" style="font-variation-settings: 'FILL' 1;">sentiment_very_satisfied</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2">Are you feeling better?</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Your health is our priority. Please tell us how you are doing today.</p>
</div>
<!-- Selection Cards (Bento Grid Style) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-gap">
<!-- Yes - Happy Card -->
<button class="entrance-fade-up group flex items-center gap-6 p-6 bg-surface-container-lowest border border-outline-variant rounded-2xl transition-all hover:bg-surface-container-high active:scale-95 min-h-[112px] text-left" onclick="handleResponse('yes')" style="animation-delay: 0.1s;">
<div class="w-16 h-16 flex items-center justify-center rounded-full bg-tertiary-container text-on-tertiary-container">
<span class="material-symbols-outlined !text-4xl" data-icon="mood" style="font-variation-settings: 'FILL' 1;">mood</span>
</div>
<div>
<span class="block font-headline-md text-headline-md text-primary">Yes</span>
<span class="font-body-md text-body-md text-on-surface-variant">I am feeling much better</span>
</div>
</button>
<!-- No - Sad Card -->
<button class="entrance-fade-up group flex items-center gap-6 p-6 bg-surface-container-lowest border border-outline-variant rounded-2xl transition-all hover:bg-surface-container-high active:scale-95 min-h-[112px] text-left" onclick="handleResponse('no')" style="animation-delay: 0.2s;">
<div class="w-16 h-16 flex items-center justify-center rounded-full bg-secondary-container text-on-secondary-container">
<span class="material-symbols-outlined !text-4xl" data-icon="mood_bad" style="font-variation-settings: 'FILL' 1;">mood_bad</span>
</div>
<div>
<span class="block font-headline-md text-headline-md text-primary">No</span>
<span class="font-body-md text-body-md text-on-surface-variant">I don't feel good yet</span>
</div>
</button>
<!-- High Risk - Emergency Card -->
<button class="entrance-fade-up md:col-span-2 group flex items-center gap-6 p-6 bg-error-container border-2 border-error rounded-2xl transition-all hover:brightness-95 active:scale-95 min-h-[128px] text-left" onclick="handleResponse('emergency')" style="animation-delay: 0.3s;">
<div class="w-20 h-20 flex items-center justify-center rounded-full bg-error text-on-error">
<span class="material-symbols-outlined !text-5xl" data-icon="emergency_share" style="font-variation-settings: 'FILL' 1;">emergency_share</span>
</div>
<div class="flex-grow">
<span class="block font-headline-md text-headline-md text-on-error-container">Need Help</span>
<span class="font-body-lg text-body-lg text-on-error-container font-semibold">Immediate Assistance Needed</span>
</div>
<span class="material-symbols-outlined !text-4xl text-on-error-container" data-icon="call">call</span>
</button>
</div>
<!-- Voice Interaction Floating Indicator -->
<div class="mt-12 flex flex-col items-center gap-4">
<button class="w-20 h-20 rounded-full bg-secondary text-on-secondary flex items-center justify-center shadow-lg active:scale-90 transition-transform pulse-animation">
<span class="material-symbols-outlined !text-4xl" data-icon="mic" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
<p class="font-voice-caption text-voice-caption text-primary italic text-center px-4">
                "Tell me how you feel..."
            </p>
</div>
</main>
<!-- Bottom Nav Bar -->
<nav class="fixed bottom-0 w-full z-50 border-t border-outline-variant dark:border-outline bg-surface-container-lowest flex justify-around items-center h-[84px] px-2">
<a class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary-fixed-dim text-on-secondary-container dark:text-on-secondary-fixed-variant rounded-xl min-w-[72px] py-1 transition-all duration-200 active:scale-95" href="#">
<span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-lg text-label-lg">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant py-1 hover:bg-surface-container-high transition-all duration-200 active:scale-95" href="#">
<span class="material-symbols-outlined" data-icon="description">description</span>
<span class="font-label-lg text-label-lg">Records</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant py-1 hover:bg-surface-container-high transition-all duration-200 active:scale-95" href="#">
<span class="material-symbols-outlined" data-icon="event_note">event_note</span>
<span class="font-label-lg text-label-lg">Reminders</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant py-1 hover:bg-surface-container-high transition-all duration-200 active:scale-95" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-lg text-label-lg">Profile</span>
</a>
</nav>
<script>
        function handleNavigation() {
            // Simulate navigation back to dashboard
            window.location.href = '#'; 
            // In a real prototype environment, this would link to {{DATA:SCREEN:SCREEN_41}}
            console.log("Navigating to {{DATA:SCREEN:SCREEN_41}}");
        }

        function handleResponse(type) {
            const body = document.querySelector('body');
            
            // Visual feedback transition
            body.style.transition = 'opacity 0.4s ease';
            body.style.opacity = '0.5';
            
            if (type === 'emergency') {
                setTimeout(() => {
                    alert('Calling emergency support... Help is on the way.');
                    window.location.href = '#'; // Redirect to Dashboard
                }, 400);
            } else if (type === 'yes') {
                setTimeout(() => {
                    alert('That is wonderful news! Redirecting to home...');
                    window.location.href = '#'; // Redirect to Dashboard
                }, 400);
            } else {
                setTimeout(() => {
                    alert('We are notifying your doctor. Please stay comfortable.');
                    window.location.href = '#'; // Redirect to Dashboard
                }, 400);
            }
        }
        
        // Simple micro-interaction for cards
        const cards = document.querySelectorAll('button');
        cards.forEach(card => {
            card.addEventListener('mouseenter', () => {
                card.style.transform = card.classList.contains('active:scale-95') ? 'translateY(-2px)' : '';
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'translateY(0)';
            });
        });
    </script>


</body></html>
